# Purpose: Local Docker Compose stack for Kafka + services + monitoring.
name: algo-trading

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    ports:
      - "22181:2181"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Two listeners:
      # - PLAINTEXT for intra-compose (containers use kafka:9092)
      # - PLAINTEXT_HOST for host access (host uses localhost:29092)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
    ports:
      - "29092:29092"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "bash", "-lc", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  metrics-service:
    build:
      context: .
      dockerfile: ./services/metrics/Dockerfile
    environment:
      METRICS_SERVICE_PORT: "9100"
    ports:
      - "9100:9100"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # DEPRECATED: Old separate ingestion service (replaced by layer1-merged)
  # layer1-ingestion:
  #   build:
  #     context: .
  #     dockerfile: ./services/layer1_ingestion/Dockerfile
  #   ...

  # DEPRECATED: Old separate validated service (replaced by layer1-merged)
  # layer1-validated:
  #   build:
  #     context: .
  #     dockerfile: ./services/layer1_validated/Dockerfile
  #   ...

  # NEW: Merged Layer 1 service (ingestion + validation in one process)
  # Eliminates Kafka hop, reduces latency from 5-10ms to <1ms
  layer1-merged:
    build:
      context: .
      dockerfile: ./services/layer1_merged/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      METRICS_PORT: "9101"
      EXCHANGES: "binance,bybit,coinbase,kraken,okx"
      SYMBOLS: "BTC-USDT,ETH-USDT"
      KAFKA_VALIDATED_TOPIC: "market.ticks.validated"
      HASH_CHAIN_LOG_PATH: "/app/logs/layer1_hash_chain.jsonl"
      TICK_QUEUE_SIZE: "10000"
      PRIMARY_EXCHANGE: "binance"
      CONSENSUS_DIVERGENCE_TOL: "0.003"
      CONSENSUS_WINDOW_MS: "50"
      CONSENSUS_ESCALATE_AFTER: "3"
      CONSENSUS_MIN_SOURCES: "2"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    ports:
      - "9101:9101"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Placeholder for old layer1-validated port (Layer 2 expects 9102)
  # Remove this once Layer 2 is updated to use layer1-merged metrics
  layer1-validated-placeholder:
    image: alpine:latest
    command: sh -c "echo 'Layer 1 validated merged into layer1-merged service' && sleep infinity"
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  layer2-anomaly:
    build:
      context: .
      dockerfile: ./services/layer2_anomaly/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      METRICS_PORT: "9103"
      KAFKA_VALIDATED_TOPIC: "market.ticks.validated"
      KAFKA_SCORED_TOPIC: "market.ticks.scored"
      KAFKA_AUTO_OFFSET_RESET: "earliest"
      HMM_MODEL_PATH: "/app/artifacts/hmm/model.pkl"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
    ports:
      - "9103:9103"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9103/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  layer3-strategy:
    build:
      context: .
      dockerfile: ./services/layer3_strategy/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      METRICS_PORT: "9104"
      KAFKA_SCORED_TOPIC: "market.ticks.scored"
      KAFKA_SIGNALS_TOPIC: "trading.signals"
      KAFKA_AUTO_OFFSET_RESET: "earliest"
    volumes:
      - ./logs:/app/logs
    ports:
      - "9104:9104"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9104/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  layer4-risk:
    build:
      context: .
      dockerfile: ./services/layer4_risk/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      METRICS_PORT: "9105"
      KAFKA_SIGNALS_TOPIC: "trading.signals"
      KAFKA_APPROVED_TOPIC: "trading.orders.approved"
      KAFKA_AUTO_OFFSET_RESET: "earliest"
    volumes:
      - ./logs:/app/logs
    ports:
      - "9105:9105"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9105/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  layer5-execution:
    build:
      context: .
      dockerfile: ./services/layer5_execution/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      METRICS_PORT: "9106"
      KAFKA_APPROVED_TOPIC: "trading.orders.approved"
      KAFKA_EXECUTED_TOPIC: "trading.orders.executed"
      KAFKA_AUTO_OFFSET_RESET: "earliest"
      EXECUTION_PERSISTENCE_DB: "/app/logs/execution_orders.db"
      # Portfolio value in BTC equivalent (1.0 = 1 BTC worth of capital)
      # For demo purposes, this represents the total capital available for trading
      PORTFOLIO_VALUE: "1.0"
      # Execution divergence check (disabled by default for demo stability)
      # Enable with ENABLE_DIVERGENCE_CHECK=true for production-grade execution validation
      ENABLE_DIVERGENCE_CHECK: "false"
      EXECUTION_VENUE: "binance"
      MAX_DIVERGENCE_BPS: "50"
    volumes:
      - ./logs:/app/logs
    ports:
      - "9106:9106"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9106/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  layer6-audit:
    build:
      context: .
      dockerfile: ./services/layer6_audit/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      METRICS_PORT: "9107"
      KAFKA_AUDIT_TOPIC: "audit.events"
      KAFKA_AUTO_OFFSET_RESET: "earliest"
      AUDIT_LOG_PATH: "/app/logs/audit_chain.jsonl"
      AUDIT_MAX_FILE_SIZE_BYTES: "104857600"
    volumes:
      - ./logs:/app/logs
    ports:
      - "9107:9107"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9107/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - metrics-service
      - layer1-merged
      - layer2-anomaly
      - layer3-strategy
      - layer4-risk
      - layer5-execution
      - layer6-audit
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    networks:
      - trading-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      kafka:
        condition: service_healthy

networks:
  trading-net:
    driver: bridge

volumes:
  grafana-storage:
