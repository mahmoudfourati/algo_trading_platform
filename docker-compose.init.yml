# Purpose: One-time initialization for Kafka topics
# Usage: docker compose -f docker-compose.init.yml up
# This ensures topics exist with explicit partition counts before starting services

name: algo-trading-init

services:
  topic-creator:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - trading-net
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        cub kafka-ready -b kafka:9092 1 60
        
        echo 'Creating topics with explicit partition counts...'
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic market.ticks.raw \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config segment.ms=3600000 \
          --config compression.type=lz4
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic market.ticks.validated \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config segment.ms=3600000 \
          --config compression.type=lz4
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic market.ticks.scored \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config segment.ms=3600000 \
          --config compression.type=lz4
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic trading.signals \
          --partitions 2 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config segment.ms=3600000 \
          --config compression.type=lz4
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic trading.orders.approved \
          --partitions 2 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config segment.ms=3600000 \
          --config compression.type=lz4
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic trading.orders.executed \
          --partitions 2 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config segment.ms=3600000 \
          --config compression.type=lz4
        
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic audit.events \
          --partitions 1 \
          --replication-factor 1 \
          --config retention.ms=2592000000 \
          --config segment.ms=86400000 \
          --config compression.type=lz4 \
          --config cleanup.policy=compact,delete
        
        echo ''
        echo 'All topics created successfully!'
        echo ''
        echo 'Topic list:'
        kafka-topics --bootstrap-server kafka:9092 --list
        
        echo ''
        echo 'Topic details:'
        kafka-topics --bootstrap-server kafka:9092 --describe
      "

networks:
  trading-net:
    external: true
    name: algo-trading_trading-net

